name: pnpm CI
run-name: "pnpm CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
        inputs:
            leg:
                description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
                type: choice
                options: [instrumented, baseline]
                default: baseline
            profile:
                description: "CrashOverride chalk profile"
                type: string
                default: curiosity-tests-racecar
            racecar_run:
                description: "racecar correlation token, echoed into the run name"
                type: string
                default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Bootstrap
              uses: ./.github/actions/bootstrap
            - name: Run format
              continue-on-error: true   # racecar: scan/report/push step, must not fail the build
              run: pnpm run format
            - name: Run compile
              env:
                  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
              run: pnpm run compile
            - name: Run test
              env:
                  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
              run: pnpm run test
